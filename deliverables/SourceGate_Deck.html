<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SourceGate｜让准入决定有据可查</title><style>*{box-sizing:border-box}body{margin:0;background:#102839;font-family:'DM Sans','Noto Sans SC',sans-serif;color:#e9f0f3}.slide{min-height:100vh;display:none;padding:44px 7vw 90px;position:relative}.slide.active{display:flex;flex-direction:column}.deck-head{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;color:#8ca6b8;border-bottom:1px solid #365061;padding-bottom:21px}.deck-head b{color:#fff;font-size:17px;letter-spacing:0}.content{margin:auto 0;padding:25px 0}h1{font-size:clamp(40px,5.8vw,84px);line-height:1.25;letter-spacing:-2px;margin:20px 0 26px;font-weight:800;max-width:1100px}h2{font-size:clamp(30px,4vw,57px);line-height:1.3;letter-spacing:-1px;margin:20px 0 28px;max-width:1100px}h3{font-size:21px;color:white;margin:0 0 12px}p{font-size:20px;color:#a9becc;line-height:1.9;max-width:1000px}em{color:#ed915d;font-style:normal}.label{font-size:12px;color:#ed915d;letter-spacing:3px;margin-bottom:22px}.big{font-size:clamp(80px,10vw,140px);font-weight:700;color:#ed915d;line-height:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:38px;margin-top:35px}.grid.two{grid-template-columns:1fr 1fr}.block{border-top:2px solid #496171;padding-top:20px}.block p{font-size:17px;margin:0}.foot{font-size:12px;color:#7893a5;position:absolute;bottom:30px;left:7vw;right:7vw}.controls{position:fixed;bottom:17px;right:24px;display:flex;align-items:center;gap:10px;background:#0b202eec;padding:8px 12px;border:1px solid #385364;border-radius:8px;font-size:12px;z-index:9}.controls button,.controls a{background:transparent;border:0;color:#d5e1e9;font:inherit;padding:6px 9px;text-decoration:none;cursor:pointer}.controls button:hover{color:#ed915d}.controls span{color:#8ca6b8;min-width:45px;text-align:center}table{width:100%;border-collapse:collapse;font-size:18px}td,th{padding:14px 15px;border-bottom:1px solid #375062;text-align:left}th{color:#8faab9;font-size:14px;font-weight:400}td:first-child{color:#f2f5f7}.formula{font-size:clamp(22px,3vw,40px);color:#fff;line-height:1.6;padding:28px 0;border-top:1px solid #476170;border-bottom:1px solid #476170}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.chip{padding:10px 16px;background:#233f51;font-size:15px;color:#b4c9d7}.pipeline{display:grid;grid-template-columns:repeat(5,1fr);gap:15px;margin:35px 0}.pipeline div{border-top:3px solid #ed915d;padding:20px 8px 0;font-size:18px}.pipeline small{display:block;color:#8faab9;font-size:14px;margin-top:10px;line-height:1.7}.light{background:#f4f7f8;color:#173447}.light .deck-head{border-color:#d4dfe5}.light .deck-head b,.light h3{color:#173447}.light p{color:#607b8c}.light td,.light th{border-color:#d4dfe5}.light td:first-child{color:#173447}.light .block{border-color:#d5e0e5}.light .formula{color:#173447;border-color:#d5e0e5}.light .chip{background:#e4ecef;color:#456172}.light .pipeline small{color:#647f90}.sub{font-size:15px;line-height:1.8;max-width:1100px}a{color:#e99a6d}ol{padding-left:25px;line-height:2.2;font-size:21px;color:#a9becc}.light ol{color:#607b8c}.status{font-size:14px;padding:4px 12px;background:#204d43;color:#a6dfc7}.subtable{font-size:16px}.subtable td{padding:10px 12px}.small-table td{font-size:16px;padding:11px}.accent-line{width:65px;height:5px;background:#ed915d;margin:25px 0}@media(max-width:760px){.slide{padding:24px 6vw 105px}.deck-head{font-size:9px;letter-spacing:1px}.grid,.grid.two{grid-template-columns:1fr;gap:22px}.pipeline{grid-template-columns:1fr 1fr}.pipeline div{font-size:16px}.foot{position:static;margin-top:30px}.controls{right:8px;bottom:8px;gap:1px;padding:5px}.controls a,.controls button{padding:6px;font-size:11px}p{font-size:17px}table{font-size:13px}td,th{padding:10px 5px}.content{overflow-x:auto}.small-table td{font-size:13px}.subtable td{font-size:13px}.big{font-size:85px}}@media print{@page{size:landscape;margin:0}.slide{display:flex!important;min-height:0;height:100vh;page-break-after:always;padding:35px 6vw 60px;print-color-adjust:exact;-webkit-print-color-adjust:exact}.controls{display:none}h1{font-size:56px}h2{font-size:40px}p{font-size:17px}.grid{gap:25px}td,th{font-size:15px;padding:9px}.foot{bottom:20px}}
</style></head><body><div id="deck"></div><div class="controls"><a href="SourceGate_App.html">打开 App</a><button id="prev" aria-label="上一页">上一页</button><span id="counter"></span><button id="next" aria-label="下一页">下一页</button><button id="print">打印 / PDF</button></div><script>/* SourceGate deterministic scoring engine. Independent of UI and AI. */
(function(root){
const dims=[
 {id:'market',name:'商业市场占有率',en:'Market position',weight:15,items:[
 ['share','可比细分市场份额',40,'%', [1,3,5,10],'第三方行业报告；明确品类、区域、年度与分母。'],
 ['projects','近三年可核实同类项目',35,'个',[1,3,5,10],'合同／验收证明与客户回访，去除重复项目。'],
 ['repeat','重复采购客户比例',25,'%', [20,40,60,80],'可比客户清单及订单；明确统计周期。']]},
 {id:'finance',name:'财务状况（近三年）',en:'Financial resilience',weight:20,items:[
 ['current','三年最低流动比率',35,'倍',[0.8,1,1.2,1.5],'流动资产÷流动负债；三年经审计报表，同一币种／实体。'],
 ['equity','三年最低权益资产比',30,'%', [5,15,25,40],'权益÷总资产；任一年净资产为负须专项审查。'],
 ['cash','三年经营现金流为正年数',35,'年',[0,1,2,3],'按各年现金流量表统计；补充持续经营及审计意见。']]},
 {id:'tech',name:'技术创新',en:'Technical innovation',weight:15,items:[
 ['rd','三年平均研发投入占营收',30,'%', [0.5,1,2,4],'研发明细与财务对账；代理商使用相应品类模板。'],
 ['validation','公司技术规格符合率',45,'%', [70,85,95,100],'逐项技术偏差表与测试报告；关键技术规格不得豁免。'],
 ['innovation','近三年已验证创新应用',25,'项',[0,1,2,4],'有客户应用和性能数据；仅有专利不视为落地。']]},
 {id:'esg',name:'ESG 标准',en:'Responsible business',weight:15,items:[
 ['environment','环境控制完成项',35,'/4',[1,2,3,4],'四项：环境方针、能耗基线、量化减排目标、外部核查。'],
 ['social','劳动与安全控制完成项',35,'/4',[1,2,3,4],'四项：劳动政策、安全培训、事件记录、整改闭环。'],
 ['governance','治理控制完成项',30,'/4',[1,2,3,4],'四项：反贿赂、举报机制、利益冲突申报、管理层审查。']]},
 {id:'supply',name:'供应链管理',en:'Supply continuity',weight:20,items:[
 ['otd','近十二个月准时交付率',40,'%', [75,85,95,98],'按合同承诺日期及完整交付计算，明确订单样本。'],
 ['dual','关键物料合格双源覆盖率',35,'%', [20,40,60,80],'按关键 BOM 统计；替代源须完成技术资格验证。'],
 ['bcp','连续性控制完成项',25,'/4',[1,2,3,4],'四项：LLE 交期台账、应急预案、演练记录、次级供应商映射。']]},
 {id:'quality',name:'质量管理',en:'Quality assurance',weight:15,items:[
 ['fpy','近十二个月一次合格率',40,'%', [85,90,95,99],'按一致检验口径统计；附 FAT／出厂检验记录。'],
 ['capa','到期 CAPA 按时关闭率',35,'%', [60,75,90,98],'按到期整改项统计；无到期项需审批证据，不自动满分。'],
 ['qms','质量控制完成项',25,'/4',[1,2,3,4],'四项：有效 QMS、ITP/FAT、追溯记录、内审与纠正。']]}
];
function policy(){return {version:'CAPEX-1.0',company:'项目采购战略寻源',weights:dims.map(d=>d.weight),floors:dims.map(()=>60),admit:75,conditional:60,criteria:Object.fromEntries(dims.flatMap(d=>d.items.map(i=>[i[0],i[4]])))};}
function band(value,thresholds){if(value===null||value===''||value===undefined||!Number.isFinite(Number(value)))return 0;let x=Number(value);if(x>=thresholds[3])return 100;if(x>=thresholds[2])return 80;if(x>=thresholds[1])return 60;if(x>=thresholds[0])return 40;return 0;}
function valid(p){return p.weights.length===6&&p.floors.length===6&&p.weights.every(w=>Number.isFinite(w)&&w>0)&&Math.abs(p.weights.reduce((a,b)=>a+b,0)-100)<1e-8&&p.floors.every(v=>v>=0&&v<=100)&&p.conditional>=0&&p.admit<=100&&p.conditional<=p.admit&&dims.every(d=>d.items.every(i=>{let a=p.criteria[i[0]];return a&&a.length===4&&a.every(Number.isFinite)&&a.every((x,n)=>n===0||x>a[n-1]);}));}
function score(s,p){
 if(!valid(p))return {decision:'配置无效',tone:'red',reasons:['权重合计须为100%，分档阈值须严格递增。'],dimensions:[],raw:0,verified:0,coverage:0};
 let dimensions=dims.map((d,di)=>{let parts=d.items.map(i=>{let x=s.metrics[i[0]]??null;let points=band(x,p.criteria[i[0]]);let ev=s.evidence.find(e=>e.dimension===d.id&&e.state==='verified');return {id:i[0],name:i[1],value:x,points,weight:i[2],verified:!!ev};});return {...d,weight:p.weights[di],floor:p.floors[di],parts,raw:parts.reduce((a,c)=>a+c.points*c.weight/100,0),verified:parts.reduce((a,c)=>a+(c.verified?c.points*c.weight/100:0),0)};});
 let raw=dimensions.reduce((a,d)=>a+d.raw*d.weight/100,0),verified=dimensions.reduce((a,d)=>a+d.verified*d.weight/100,0),coverage=dimensions.reduce((a,d)=>a+(d.parts.every(i=>i.verified)?d.weight:0),0);
 let reasons=[],decision,tone='amber';
 if(s.redline){decision='不予准入';tone='red';reasons.push('已确认触发红线：'+s.redline);}
 else if(!s.submitted){decision='草稿';reasons.push('供应商尚未签署并提交。');}
 else if(!s.signatureValid||s.signPolicy!==p.version||!s.authorized||coverage<100||s.clarifications.some(c=>c.status!=='closed')||dimensions.some(d=>d.parts.some(i=>i.value===null))){decision='待核验 / 澄清';if(!s.signatureValid)reasons.push('签名缺失、已失效或尚未通过完整性验证。');if(s.signPolicy!==p.version)reasons.push('须按当前评分规则版本重新签署。');if(!s.authorized)reasons.push('签署人身份与授权尚未核实。');if(coverage<100)reasons.push('存在未经确认的维度证据。');if(s.clarifications.some(c=>c.status!=='closed'))reasons.push('存在未关闭的澄清。');if(dimensions.some(d=>d.parts.some(i=>i.value===null)))reasons.push('存在未填写指标。');}
 else if(dimensions.some(d=>d.verified<d.floor)||verified<p.conditional){decision='不予准入';tone='red';reasons.push(...dimensions.filter(d=>d.verified<d.floor).map(d=>`${d.name}低于${d.floor}分基准线`));if(verified<p.conditional)reasons.push('总分低于最低准入门槛。');}
 else if(verified<p.admit){decision='有条件准入';reasons.push('须制定整改、期限和限额，经审批后方可录入。');}
 else{decision='建议准入';tone='green';reasons.push('六维基准线、证据、签名和澄清检查均通过；待采购负责人审批。');}
 return {dimensions,raw,verified,coverage,decision,tone,reasons};
}
root.SourceGate={dims,policy,band,valid,score};if(typeof module!=='undefined')module.exports=root.SourceGate;
})(typeof window!=='undefined'?window:globalThis);
</script><script>const slides=[
{label:'项目采购战略寻源 · 供应商准入',title:'让每一项<em>准入决定</em>，<br>都有可复核的证据。',body:'<p>SourceGate 把供应商申报、电子签署、证据核验与六维评分，连成一条可解释、可重算的审核路径。</p><div class="accent-line"></div><p class="sub">CAPEX / 数据中心设备 / LLE / EPC<br>项目方案与可交互原型 · 2026 年 11 月</p>'},
{label:'问题',title:'拿到一份资料，<br>不等于完成一次审核。',body:'<div class="grid"><div class="block"><h3>声明缺乏验证</h3><p>市场份额、项目经验、ESG 和质量指标，常依赖供应商自报。</p></div><div class="block"><h3>评分口径不一致</h3><p>相同资料，不同评审人可能给出不同分数，难以复核。</p></div><div class="block"><h3>高分掩盖关键风险</h3><p>总分达标，仍可能缺少签署授权、关键技术能力或有效证书。</p></div></div>'},
{label:'参考项目的启发',title:'把 Maple Ledger 的原则，<br>转化为<em>供应商准入</em>。',body:'<table><thead><tr><th>Maple Ledger</th><th>SourceGate 的落地</th></tr></thead><tbody><tr><td>供应商签署来源声明</td><td>签署公司申报、指标和附件摘要</td></tr><tr><td>哈希与签名检查完整性</td><td>发现签署后资料和附件变更</td></tr><tr><td>独立核验与异常检测</td><td>第三方佐证、交叉核对、人工澄清</td></tr><tr><td>固定规则计算判定</td><td>版本化六维评分与准入门槛</td></tr></tbody></table><p class="sub">借鉴方法和产品结构，独立实现；未复用其代码。签名有效不能证明事实真实。</p>'},
{label:'产品工作流',title:'从申报到准入，<em>每一步留有依据</em>。',body:'<div class="pipeline"><div>供应商申报<small>六维指标<br>三年财务<br>附件与声明</small></div><div>签署与核验<small>文件摘要<br>签名完整性<br>身份及授权</small></div><div>按规则评分<small>固定计算<br>证据状态<br>版本可追溯</small></div><div>澄清与复核<small>提出疑问<br>补充证据<br>审核人关闭</small></div><div>结论与审批<small>建议 / 有条件 / 拒绝<br>授权审批<br>后续系统录入</small></div></div><p class="sub">任何资料更新都触发重新签署；未关闭澄清阻止准入建议。正式入库由授权审批和后端集成执行。</p>'},
{label:'公司评分模型 · 建议初始模板',title:'六个维度，<em>六条基准线</em>。',light:true,body:'<table><thead><tr><th>维度</th><th>总权重</th><th>主要判断</th><th>最低分</th></tr></thead><tbody><tr><td>商业市场占有率</td><td>15%</td><td>细分市场份额、同类项目、复购客户</td><td>60</td></tr><tr><td>财务状况（近三年）</td><td>20%</td><td>流动性、资本结构、经营现金流</td><td>60</td></tr><tr><td>技术创新</td><td>15%</td><td>研发投入、规格符合、创新落地</td><td>60</td></tr><tr><td>ESG 标准</td><td>15%</td><td>环境、劳动安全、治理控制</td><td>60</td></tr><tr><td>供应链管理</td><td>20%</td><td>交付、双源、业务连续性</td><td>60</td></tr><tr><td>质量管理</td><td>15%</td><td>一次合格率、CAPA、质量控制</td><td>60</td></tr></tbody></table><p class="sub">权重、基准线和子指标锚点可配置；上线前须根据公司、地区与品类批准。</p>'},
{label:'评分机制',title:'同一份证据、同一版规则，<br>应得出<em>同一个分数</em>。',body:'<div class="formula">维度分 = Σ（指标档位分 × 维度内权重）<br>总分 = Σ（维度分 × 公司维度权重）</div><div class="grid"><div><div class="big">0–100</div><p>低于首档为 0；四档为<br>40 / 60 / 80 / 100。</p></div><div><div class="big">60</div><p>每维默认基准。<br>任一维度低于基准即不通过。</p></div><div><div class="big">75</div><p>建议准入总分。<br>60–74.99 分为有条件准入。</p></div></div><p class="sub">缺失证据保持待核验，不将未知事实当成确认失败。判定使用原始计算精度。</p>'},
{label:'商业、财务与技术 · 评分锚点',title:'把经验判断，写成<em>明确阈值</em>。',light:true,body:'<table class="subtable"><thead><tr><th>指标（内部权重）</th><th>40 分</th><th>60 分</th><th>80 分</th><th>100 分</th></tr></thead><tbody><tr><td>市场份额 40%</td><td>1%</td><td>3%</td><td>5%</td><td>10%</td></tr><tr><td>同类项目 35% / 复购 25%</td><td>1 / 20%</td><td>3 / 40%</td><td>5 / 60%</td><td>10 / 80%</td></tr><tr><td>三年最低流动比率 35%</td><td>0.8</td><td>1.0</td><td>1.2</td><td>1.5</td></tr><tr><td>三年最低权益资产比 30%</td><td>5%</td><td>15%</td><td>25%</td><td>40%</td></tr><tr><td>正经营现金流年数 35%</td><td>0 年</td><td>1 年</td><td>2 年</td><td>3 年</td></tr><tr><td>研发占营收 30%</td><td>0.5%</td><td>1%</td><td>2%</td><td>4%</td></tr><tr><td>技术规格符合 45% / 创新应用 25%</td><td>70% / 0 项</td><td>85% / 1 项</td><td>95% / 2 项</td><td>100% / 4 项</td></tr></tbody></table><p class="sub">所有档位均为“达到该阈值”。市场份额需独立分母；财务使用三个完整财年；关键技术规格另设硬门槛。研发指标需按制造商／代理商分别校准。</p>'},
{label:'ESG、供应链与质量 · 评分锚点',title:'管理体系要看<em>执行证据</em>。',light:true,body:'<table class="subtable"><thead><tr><th>指标（内部权重）</th><th>40 分</th><th>60 分</th><th>80 分</th><th>100 分</th></tr></thead><tbody><tr><td>ESG：环境35% / 社会35% / 治理30%</td><td>1 项</td><td>2 项</td><td>3 项</td><td>4 项</td></tr><tr><td>准时交付率 40%</td><td>75%</td><td>85%</td><td>95%</td><td>98%</td></tr><tr><td>关键物料双源覆盖 35%</td><td>20%</td><td>40%</td><td>60%</td><td>80%</td></tr><tr><td>业务连续性控制 25%</td><td>1 项</td><td>2 项</td><td>3 项</td><td>4 项</td></tr><tr><td>一次合格率 40%</td><td>85%</td><td>90%</td><td>95%</td><td>99%</td></tr><tr><td>CAPA 按时关闭率 35%</td><td>60%</td><td>75%</td><td>90%</td><td>98%</td></tr><tr><td>质量控制 25%</td><td>1 项</td><td>2 项</td><td>3 项</td><td>4 项</td></tr></tbody></table><p class="sub">“完成一项”必须有文件与执行记录。完整控制清单及证据要求见 App 公司评分规则页。无到期 CAPA 不自动得满分，须审核替代证明。</p>'},
{label:'信任边界',title:'核实三个不同的问题。',body:'<div class="grid"><div class="block"><h3>内容有没有改变？</h3><p>对文件计算 SHA-256，签名覆盖当前申报快照和文件摘要。变更后要求重新签署。</p><div class="chips"><span class="chip">完整性</span></div></div><div class="block"><h3>是谁，有没有授权？</h3><p>企业注册核对、公司邮箱、签署身份与授权书；生产接入受信身份和电子签平台。</p><div class="chips"><span class="chip">身份与授权</span></div></div><div class="block"><h3>内容是不是真实？</h3><p>审计师确认、发证方查验、客户回访、指标对账与必要现场审核。</p><div class="chips"><span class="chip">事实真实性</span></div></div></div><p class="sub">原型实际实现密码学签署与摘要复核；身份和事实核验是人工记录，未宣称自动认证。</p>'},
{label:'准入判定',title:'有些风险，<em>总分不能抵消</em>。',body:'<table><thead><tr><th>优先顺序</th><th>条件</th><th>输出</th></tr></thead><tbody><tr><td>1</td><td>已确认造假、严重不符合等红线</td><td>不予准入</td></tr><tr><td>2</td><td>未提交 / 未签署</td><td>草稿</td></tr><tr><td>3</td><td>签名、授权、证据、字段或澄清未完成</td><td>待核验 / 澄清</td></tr><tr><td>4</td><td>任一维低于 60，或总分低于 60</td><td>不予准入</td></tr><tr><td>5</td><td>每维达标，总分 60–74.99</td><td>有条件准入，待授权审批</td></tr><tr><td>6</td><td>每维达标，总分 ≥75</td><td>建议准入，待授权审批</td></tr></tbody></table><p class="sub">有条件准入必须记录整改、期限、限额与审批人；实际入库仍须后端控制。</p>'},
{label:'可复算示例 · 虚构供应商',title:'总分达标，<em>仍可能需要等待</em>。',light:true,body:'<table class="small-table"><thead><tr><th>Northstar Cooling Systems</th><th>维度分</th><th>权重</th><th>总分贡献</th></tr></thead><tbody id="example-scores"></tbody></table><p class="sub" id="example-total"></p><p>即使申报分超过 75，缺少签署授权或证据时仍为“待核验”。<br>全部核实并关闭澄清后，才产生“建议准入”。</p>'},
{label:'生产架构',title:'规则做判定，AI 辅助审阅，<br><em>人承担审批责任</em>。',body:'<div class="grid two"><div class="block"><h3>供应商门户 + 企业身份</h3><p>企业认证、签署权限、受信密钥、电子签回执。</p></div><div class="block"><h3>证据服务 + 外部核验</h3><p>文件扫描、版本、摘要、发证机构及财务来源。</p></div><div class="block"><h3>版本化评分引擎 + 澄清</h3><p>固定计分、AI 提取候选事实及页码、人工确认。</p></div><div class="block"><h3>审批、审计 + ERP</h3><p>职责分离、不可变日志、准入范围与复审日期。</p></div></div><p class="sub">AI 不决定真实性，不修改分数；模型输出先映射证据，确认后进入规则引擎。</p>'},
{label:'交付范围与下一阶段',title:'先跑通审核闭环，<br>再接入<em>真实企业验证</em>。',body:'<div class="grid two"><div class="block"><h3>本次已实现</h3><p>七个审核视图、18 项指标、三年财务、公司阈值、附件保存及摘要、签名与验证、澄清闭环、审批记录与 JSON 报告。</p></div><div class="block"><h3>生产前必须完成</h3><p>后端及账户权限、可信身份和电子签、证据 API、恶意文件扫描、服务端规则复算、不可变审计、数据保留及 ERP 集成。</p></div></div><p class="sub">建议试点：选择冷却系统或电力设备一个品类，回测 10–20 家历史供应商；比较人工结论、误放行及澄清负担，再批准政策版本。数量为建议，不是已完成结果。</p>'},
{label:'演示路径',title:'从“供应商填了什么”，<br>走到“<em>我们核实了什么</em>”。',body:'<ol><li>打开 Northstar 案例，填写和保存申报。</li><li>上传六维证据包，确认声明并签署。</li><li>复核签名，记录身份授权及逐维证据核验。</li><li>提出澄清，回复、复核并关闭。</li><li>查看六维分数，记录审批并导出报告。</li></ol><p class="sub">篡改申报或更新规则后，原签名和审批将失效。此版本用于产品验证，不用于正式供应商入库。</p>'},
{label:'参考与边界',title:'可信来自<em>可复核的过程</em>。',body:'<p>参考来源</p><p class="sub"><a href="https://github.com/MtsYama/Maple_Ledger-Team-TrueNorth-Red_Team_Hackathon" target="_blank">Maple Ledger · GitHub README</a><br><a href="https://maple-ledger-team-true-north-red-te.vercel.app/" target="_blank">Maple Ledger · Purchaser / Verifier Demo</a><br><a href="https://deck.ashtonshu.page/competition/2026-05-30-redteam-hackathon/cn" target="_blank">Maple Ledger · 中文 Pitch</a></p><p class="sub">参考链接于 2026-11-22 阅读。六维结构来自用户；评分阈值、权重、准入逻辑和项目架构为本项目建议，非 ISO 或监管机构规定。未使用原项目性能数字作为本项目能力声明。</p><div class="accent-line"></div><p><a href="SourceGate_App.html">进入 SourceGate 供应商审核工作台</a></p>'}
];
document.querySelector('#deck').innerHTML=slides.map((s,n)=>`<section class="slide ${s.light?'light':''}" id="slide-${n+1}"><div class="deck-head"><b>SourceGate</b><span>SUPPLIER ASSURANCE · ${String(n+1).padStart(2,'0')} / ${slides.length}</span></div><div class="content"><div class="label">${s.label}</div><${n===0?'h1':'h2'}>${s.title}</${n===0?'h1':'h2'}>${s.body}</div><div class="foot">项目采购战略寻源 · 建议评分政策与交互原型 · 2026-11-22</div></section>`).join('');
let current=Math.max(0,Math.min(slides.length-1,Number(location.hash.slice(1)||1)-1));function show(){document.querySelectorAll('.slide').forEach((s,n)=>s.classList.toggle('active',n===current));document.querySelector('#counter').textContent=`${current+1} / ${slides.length}`;history.replaceState(null,'','#'+(current+1));window.scrollTo(0,0);}function move(n){current=Math.max(0,Math.min(slides.length-1,current+n));show();}document.querySelector('#prev').onclick=()=>move(-1);document.querySelector('#next').onclick=()=>move(1);document.querySelector('#print').onclick=()=>window.print();window.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();move(1);}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1);}if(e.key==='Home'){current=0;show();}if(e.key==='End'){current=slides.length-1;show();}});show();
(()=>{let p=SourceGate.policy(),values=[6,7,65,1.5,35,3,2.5,100,3,3,3,4,96,70,4,98,95,4],s={metrics:Object.fromEntries(SourceGate.dims.flatMap(d=>d.items).map((i,n)=>[i[0],values[n]])),evidence:[],clarifications:[],submitted:true},r=SourceGate.score(s,p);document.querySelector('#example-scores').innerHTML=r.dimensions.map(d=>`<tr><td>${d.name}</td><td>${d.raw.toFixed(1)}</td><td>${d.weight}%</td><td>${(d.raw*d.weight/100).toFixed(2)}</td></tr>`).join('');document.querySelector('#example-total').textContent='申报测算总分 = '+r.raw.toFixed(2)+'；证据核实前，核实总分 = 0。示例与 App 使用同一评分引擎。';})();
